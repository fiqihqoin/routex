map $host $caishenengine_env {
    hostnames;
    api.caishenengine.com        "production";
    production.caishenengine.com "production";
    sandbox.caishenengine.com    "sandbox";
    default                      "sandbox";
}

server {
    listen 80;
    server_name caishenengine.com app.caishenengine.com;

    location ~ ^/(login|register|logout|portal|admin|sanctum|api/portal|email|vendor|storage) {
        proxy_pass         http://admin:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        proxy_pass         http://fe:80;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name docs.caishenengine.com;

    location / {
        proxy_pass         http://docs:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.caishenengine.com;

    location / {
        proxy_pass         http://admin:9000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name api.caishenengine.com 
                sandbox.caishenengine.com 
                production.caishenengine.com;

    location / {
        proxy_pass         http://transaction-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Host                  $host;
        proxy_set_header   X-Real-IP             $remote_addr;
        proxy_set_header   X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto     $scheme;
        proxy_set_header   X-CaishenEngine-Environment  $caishenengine_env;
        proxy_read_timeout 30s;
    }
}
# ==================== FE (Homepage + Merchant Portal) ====================
server {
    listen 80;
    server_name routex.web.id app.routex.web.id;

    # Handle API & Auth requests (Arahkan ke Laravel Admin)
    location ~ ^/(login|register|logout|portal|sanctum|api/portal) {
        proxy_pass http://admin:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle Frontend Static Files (React App)
    location / {
        proxy_pass http://fe:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# ==================== DOCS ====================

# Upstream definitions with keepalive for better performance
upstream php_backend {
    server caishenengine-admin:9000;
    keepalive 32;  # Keep 32 connections alive
}

upstream go_api_backend {
    server caishenengine-transaction-api:8080;
    keepalive 16;  # Keep 16 connections alive
}

upstream fe_backend {
    server caishenengine-fe:80;
    keepalive 8;
}

upstream docs_backend {
    server caishenengine-docs:3000;
    keepalive 8;
}

map $host $caishenengine_env {
    hostnames;
    api.caishenengine.com        "production";
    production.caishenengine.com "production";
    sandbox.caishenengine.com    "sandbox";
    default                      "sandbox";
}

server {
    listen 80;
    server_name caishenengine.com app.caishenengine.com;

    # API endpoints & Sanctum auth → Laravel
    location ~ ^/(api|sanctum)(/|$) {
        proxy_pass         http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Admin panel → Laravel
    location ~ ^/admin(/|$) {
        proxy_pass         http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Laravel Assets & Livewire → Laravel
    location ~ ^/(css|js|livewire|vendor|storage|images|fonts)(/|$) {
        proxy_pass         http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Everything else (/, /login, /portal/*) → React Frontend
    location / {
        proxy_pass         http://fe_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name docs.caishenengine.com;

    location / {
        proxy_pass         http://docs_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name admin.caishenengine.com;

    location / {
        proxy_pass         http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets for admin.caishenengine.com
    location ~ ^/(css|js|livewire|vendor|storage|images|fonts)(/|$) {
        proxy_pass         http://php_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name api.caishenengine.com
                sandbox.caishenengine.com
                production.caishenengine.com;

    location / {
        proxy_pass         http://go_api_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection "";  # Enable keepalive
        proxy_set_header   Host                  $host;
        proxy_set_header   X-Real-IP             $remote_addr;
        proxy_set_header   X-Forwarded-For       $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto     $scheme;
        proxy_set_header   X-CaishenEngine-Environment  $caishenengine_env;
        proxy_read_timeout 30s;
    }
}
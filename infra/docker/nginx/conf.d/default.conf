# Map Host to Environment
map $host $routex_env {
    # Production
    "api.routex.id"        "production";
    "routex.id"            "production";

    # Sandbox
    "sandbox.routex.id"    "sandbox";

    # Local Development
    "api.localhost"        "production";
    "sandbox.localhost"    "sandbox";
    "localhost"            "sandbox";

    # Default to sandbox for safety
    default                "sandbox";
}

# Rate Limiting Zones (Defense-in-depth)
limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
limit_req_zone $binary_remote_addr zone=admin_limit:10m rate=10r/s;

upstream transaction_api {
    server ptms-transaction-api:8080 max_fails=3 fail_timeout=10s;
    keepalive 32;
}

upstream admin_service {
    server ptms-admin:9000;
}

server {
    listen 80;
    server_name localhost sandbox.localhost api.localhost;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name localhost sandbox.localhost api.localhost;

    # TLS Termination
    ssl_certificate     /etc/nginx/certs/ptms.crt;
    ssl_certificate_key /etc/nginx/certs/ptms.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Request Buffering (PRD Requirement)
    proxy_request_buffering on;
    proxy_buffering on;
    client_max_body_size 10M;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";

    # Proxy Headers
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Route 1: Go Transaction API (Specific v1)
    location /api/v1/ {
        limit_req zone=api_limit burst=50 nodelay;
        proxy_pass http://transaction_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header X-Routex-Environment $routex_env;
    }

    # Route 2: Laravel Admin (Filament)
    location /admin {
        limit_req zone=admin_limit burst=10;
        proxy_pass http://admin_service;
    }

    # Route 3: Laravel Merchant Portal
    location /portal {
        limit_req zone=admin_limit burst=20;
        proxy_pass http://admin_service;
    }

    # Route 4: Prometheus Metrics
    location /metrics {
        proxy_pass http://transaction_api/metrics;
    }

    # Route 5: Catch-all (Default Admin/Assets)
    location / {
        limit_req zone=admin_limit burst=20;
        proxy_pass http://admin_service;
    }

    # Health Check Endpoint
    location /health {
        access_log off;
        return 200 '{"status":"UP"}';
        add_header Content-Type application/json;
    }

    error_page 502 /502.json;
    location /502.json {
        return 502 '{"error": "Service Temporarily Unavailable (NGINX)"}';
        add_header Content-Type application/json;
    }
}
